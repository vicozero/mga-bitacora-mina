services:
  - type: web
    name: mga-bitacora-mina
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: DATA_FILE
        value: /var/data/records.json
      - key: PUBLIC_APP_URL
        value: https://mga-bitacora-mina.onrender.com
      - key: SLACK_WEBHOOK_URL
        sync: false
    disk:
      name: mga-bitacora-data
      mountPath: /var/data
      sizeGB: 1
